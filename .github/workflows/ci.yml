name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          shellcheck scripts/*.sh
          for f in bucket/*.json; do jq -e . "$f" > /dev/null; done

  install:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The installer script is pinned to a commit; it then fetches Scoop itself.
      - name: Install Scoop
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install.ps1'
          Invoke-WebRequest 'https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1' -OutFile $installer
          & $installer -RunAsAdmin
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE 'scoop\shims')
      - shell: pwsh
        run: scripts/test-manifest.ps1
